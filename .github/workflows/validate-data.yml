name: Validate Data

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate question and locale data
        run: node scripts/validate_data.js
